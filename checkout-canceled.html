<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Canceled – Lumen Steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue:#1bafc8; --teal:#2dc4b2; --navy:#1a2e4a; --text:#3a4a5c; --light:#f4fbfc; --white:#ffffff; --amber:#f5c842; }
    body {
      font-family:'Inter',sans-serif; color:var(--text); background:linear-gradient(135deg,var(--light),#e8f8fb);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card {
      background:var(--white); border-radius:20px; padding:48px 40px; max-width:440px; width:100%;
      text-align:center; box-shadow:0 24px 60px rgba(26,46,74,.14);
    }
    .logo { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:28px; }
    .logo span { font-size:1.15rem; font-weight:700; color:var(--navy); letter-spacing:-.3px; }
    .icon-circle {
      width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg,#fdf1cf,#faE3a0);
      display:flex; align-items:center; justify-content:center; margin:0 auto 24px;
    }
    .icon-circle svg { width:34px; height:34px; color:#b8860b; }
    h1 { font-size:1.5rem; font-weight:800; color:var(--navy); margin-bottom:12px; }
    p { font-size:.95rem; line-height:1.65; color:var(--text); margin-bottom:10px; }
    .sub { font-size:.85rem; color:var(--text); opacity:.75; margin-bottom:28px; }
    .instructions {
      background:var(--light); border-radius:14px; padding:18px 20px; text-align:left; margin-bottom:8px;
    }
    .instructions p { margin-bottom:0; font-size:.88rem; }
    .instructions strong { color:var(--navy); }
    footer { margin-top:24px; font-size:.78rem; color:var(--text); opacity:.6; }
    footer a { color:var(--blue); text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
        <path d="M20,20 L28.15,16.19 L37,20 L28.15,23.81 Z" fill="#2bb8c4"/>
        <path d="M20,20 L27.37,14.83 L28.5,5.28 L20.79,11.04 Z" fill="#4a90e2"/>
        <path d="M20,20 L19.21,11.04 L11.5,5.28 L12.63,14.83 Z" fill="#f9b233"/>
        <path d="M20,20 L11.85,16.19 L3,20 L11.85,23.81 Z" fill="#f7941e"/>
        <path d="M20,20 L12.63,25.17 L11.5,34.72 L19.21,28.96 Z" fill="#14897a"/>
        <path d="M20,20 L20.79,28.96 L28.5,34.72 L27.37,25.17 Z" fill="#8dc63f"/>
      </svg>
      <span>Lumen Steps</span>
    </div>

    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>

    <h1>Checkout canceled</h1>
    <p>No charge was made — your card was not billed.</p>
    <p class="sub">You can safely close this tab now.</p>

    <div class="instructions">
      <p><strong>Return to the Lumen Steps app</strong> whenever you're ready to add payment. You'll find the same "Add Payment Info" button waiting for you.</p>
    </div>

    <footer>Questions? <a href="mailto:lumensteps@gmail.com">lumensteps@gmail.com</a></footer>
  </div>
</body>
</html>
